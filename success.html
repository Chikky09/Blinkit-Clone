<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Success</title>

<style>

body{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    background:#f8f8f8;

    font-family:Arial;
}

.success-box{

    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.tick{

    font-size:70px;
}

h1{

    color:#0c831f;

    margin-top:20px;
}

</style>

</head>
<body>

<div class="success-box">

    <div class="tick">

        ✅ 

    </div>

    <h1>

        Order Placed Successfully

    </h1>

    <p>

        Your groceries will arrive
        in 10 minutes.

    </p>

</div>

</body>
</html>
