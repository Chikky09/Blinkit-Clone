<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================
   BODY
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f5f5f5;
}


/* =========================
   LOGIN BOX
========================= */

.login-container{

    width:380px;

    background:#ffffff;

    padding:35px;

    border-radius:20px;

    box-shadow:0 5px 20px rgba(0,0,0,0.1);

    text-align:center;
}


/* LOGO */

.login-container h1{

    color:#0c831f;

    margin-bottom:10px;

    font-size:38px;
}

/* TEXT */

.login-container p{

    color:#777777;

    margin-bottom:25px;

    font-size:15px;
}

/* INPUT BOX */

.input-box{

    position:relative;

    margin-bottom:20px;
}

.input-box input{

    width:100%;

    height:50px;

    border:1px solid #dddddd;

    border-radius:10px;

    padding-left:45px;

    font-size:16px;

    outline:none;
}

/* ICON */

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#777777;
}

/* BUTTON */

.login-btn{

    width:100%;

    height:50px;

    border:none;

    background:#0c831f;

    color:#ffffff;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;

    transition:0.3s;

    font-weight:600;
}

.login-btn:hover{

    background:#096b18;
}

/* REGISTER TEXT */

.register-text{

    margin-top:20px;

    font-size:15px;

    color:#555555;
}

/* REGISTER LINK */

.register-text a{

    text-decoration:none;

    color:#0c831f;

    font-weight:600;
}

/* HOVER */

.register-text a:hover{

    color:#096b18;
}

</style>

</head>

<body>

<!-- LOGIN BOX -->

<div class="login-container">

    <h1>Blinkit</h1>

    <p>Login to continue shopping</p>

    <!-- EMAIL -->

    <div class="input-box">

        <i class="fa-solid fa-envelope"></i>

        <input type="email"
        id="email"
        placeholder="Enter Email">

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input type="password"
        id="password"
        placeholder="Enter Password">

    </div>

    <!-- BUTTON -->

    <button class="login-btn"
    onclick="loginUser()">

        Login

    </button>

    <!-- REGISTER -->

    <div class="register-text">

        Don't have an account?

        <a href="register.html">

            Register

        </a>

    </div>

</div>


<script>

/* =========================
   LOGIN FUNCTION
========================= */

function loginUser(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    if(email === "" || password === ""){

        alert("Please fill all fields");

    }
    else{

        alert("Login Successful");

        window.location.href = "index.html";
    }

}

</script>

</body>
</html>
