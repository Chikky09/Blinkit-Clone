<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================
   BODY
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f5f5f5;
}


/* =========================
   REGISTER BOX
========================= */

.register-container{

    width:400px;

    background:#ffffff;

    padding:35px;

    border-radius:20px;

    box-shadow:0 5px 20px rgba(0,0,0,0.1);

    text-align:center;
}

/* TITLE */

.register-container h1{

    color:#0c831f;

    margin-bottom:10px;
}

/* TEXT */

.register-container p{

    color:#777777;

    margin-bottom:25px;
}

/* INPUT BOX */

.input-box{

    position:relative;

    margin-bottom:20px;
}

.input-box input{

    width:100%;

    height:50px;

    border:1px solid #dddddd;

    border-radius:10px;

    padding-left:45px;

    font-size:16px;
}

/* ICON */

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#777777;
}

/* BUTTON */

.register-btn{

    width:100%;

    height:50px;

    border:none;

    background:#0c831f;

    color:#ffffff;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;

    transition:0.3s;
}

.register-btn:hover{

    background:#096b18;
}

/* LOGIN */

.login-text{

    margin-top:20px;

    font-size:15px;
}

.login-text a{

    color:#0c831f;

    text-decoration:none;

    font-weight:600;
}

</style>

</head>

<body>

<!-- REGISTER BOX -->

<div class="register-container">

    <h1>Create Account</h1>

    <p>Register to continue shopping</p>

    <!-- NAME -->

    <div class="input-box">

        <i class="fa-solid fa-user"></i>

        <input type="text"
        id="name"
        placeholder="Enter Name">

    </div>

    <!-- EMAIL -->

    <div class="input-box">

        <i class="fa-solid fa-envelope"></i>

        <input type="email"
        id="email"
        placeholder="Enter Email">

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input type="password"
        id="password"
        placeholder="Enter Password">

    </div>

    <!-- CONFIRM PASSWORD -->

    <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input type="password"
        id="confirmPassword"
        placeholder="Confirm Password">

    </div>

    <!-- BUTTON -->

    <button class="register-btn"
    onclick="registerUser()">

        Register

    </button>

    <!-- LOGIN -->

    <div class="login-text">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </div>

</div>


<script>

/* =========================
   REGISTER FUNCTION
========================= */

function registerUser(){

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const confirmPassword =
    document.getElementById("confirmPassword").value;

    /* EMPTY CHECK */

    if(
        name === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
    ){

        alert("Please fill all fields");

        return;
    }

    /* PASSWORD CHECK */

    if(password !== confirmPassword){

        alert("Passwords do not match");

        return;
    }

    /* SUCCESS */

    alert("Registration Successful");

    window.location.href = "login.html";

}

</script>

</body>
</html>
